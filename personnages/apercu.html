<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Aperçu des personnages 3D (prototype) · Les Lanternes de Nour</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcc4; font: 14px system-ui, sans-serif; color: #2a2118; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #panneau { position: fixed; left: 8px; top: 8px; max-width: 330px; max-height: calc(100% - 16px); overflow: auto; background: #fffaf0e8; border-radius: 12px; padding: 8px 10px; box-shadow: 0 2px 12px #0004; }
  #panneau h1 { font-size: 14px; margin: 0 0 4px; } #panneau h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 3px; color: #7a5a3a; }
  #panneau div.groupe { display: flex; flex-wrap: wrap; gap: 4px; }
  button { font: inherit; padding: 3px 8px; border: 1px solid #c9b48a; background: #fff; border-radius: 8px; cursor: pointer; }
  button.on { background: #2bb3c0; color: #fff; border-color: #2bb3c0; }
  .legende { position: fixed; right: 8px; bottom: 8px; background: #fffaf0e8; padding: 4px 10px; border-radius: 10px; font-size: 12px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panneau">
  <h1>Prototype : personnage-test</h1>
  <h2>Personnage</h2><div class="groupe" id="genre"></div>
  <h2>Comparer</h2><div class="groupe" id="mode"></div>
  <h2>Pose</h2><div class="groupe" id="poses"></div>
  <div class="groupe" style="margin-top:4px"><button id="marche">Marche (Grand Voyage)</button></div>
  <h2>Caméra (ou glisser / molette)</h2><div class="groupe" id="vues"></div>
  <h2>Expression</h2><label>Sourire <input type="range" id="sourire" min="0" max="1" step="0.05" value="0"></label>
  <h2>Maillage</h2><div class="groupe"><button id="filaire">Fil de fer</button></div>
</div>
<div class="legende">À gauche : ancien personnage · À droite : personnage-test (squelette commun)</div>
</body>
</html>
