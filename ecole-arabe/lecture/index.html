<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Je découvre la lecture arabe – L'École arabe de Maktoub</title>
<meta name="description" content="Apprendre à lire l'arabe avec Maktoub : voyelles, syllabes, mots et phrases, à ton rythme.">
<meta name="theme-color" content="#191345">
<link rel="icon" href="../../intro/favicon-48.png">
<script src="../../monde/socle/sans-visage.js?v=1"></script>
<link rel="stylesheet" href="../commun/decor.css?v=3">
<link rel="stylesheet" href="../lettres/ecole.css?v=3">
<link rel="stylesheet" href="lecture.css?v=3">
</head>
<body>
<div id="fond" class="decor" aria-hidden="true"></div>
<header id="barre">
  <button id="btn-retour" class="rond cache" aria-label="Retour">‹</button>
  <h1 id="titre">Je découvre la lecture arabe</h1>
  <div class="outils"><button id="btn-son" class="rond" aria-label="Son : activé" title="Son">🔊</button><button id="btn-reglages" class="rond" aria-label="Réglages" title="Réglages">⚙️</button></div>
</header>
<main id="ecran" aria-live="polite"></main>
<aside id="guide" aria-hidden="true"></aside>
<p id="sous-titres" class="sous-titres cache" role="status" aria-live="polite"></p>
<section id="reglages" class="carte petit cache" role="dialog" aria-labelledby="reglages-titre"><h2 id="reglages-titre">Réglages</h2>
  <label class="ligne"><input type="checkbox" id="st-case" checked> Sous-titres</label>
  <label class="ligne"><input type="checkbox" id="muet-case"> Mode silencieux</label>
  <label class="ligne">Volume de la voix <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume de la voix"></label>
  <button id="changer-age" class="secondaire">Changer mon âge</button>
  <div class="actions"><button id="reglages-fermer" class="principal">Fermer</button></div></section>
<script type="module" src="jeu.js?v=3"></script>
<script src="../../compte/barre.js?v=3" defer data-menu="1" data-pos="bas-droite"></script>
</body>
</html>
