<style>
:root{--nuit:#191345;--n2:#241a5e;--vi:#3a2a7d;--or:#f5b942;--od:#ffe3a3;--cr:#fff8e7;--tx:#f4efff;--t2:#c9bfe8}
*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0,#2b2170,var(--nuit) 60%);color:var(--tx);font-family:"Nunito","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Poppins","Segoe UI",system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer}
.sky{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff8 50%,transparent),radial-gradient(1px 1px at 72% 12%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 88% 40%,#fff6 50%,transparent),radial-gradient(1px 1px at 30% 70%,#fff7 50%,transparent),radial-gradient(1.5px 1.5px at 60% 85%,#fff5 50%,transparent),radial-gradient(1px 1px at 8% 55%,#fff8 50%,transparent)}
.app{position:relative;max-width:620px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kids{display:flex;gap:6px;flex-wrap:wrap}.kid{border:1px solid #f5b94288;background:transparent;color:var(--tx);border-radius:99px;padding:6px 12px;font-weight:700}
.kid.on{background:var(--or);color:var(--nuit)}.ico{border:0;background:#ffffff14;color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:18px}
header{text-align:center;margin:14px 0 6px}header small{letter-spacing:.18em;text-transform:uppercase;color:var(--t2);font-size:12px;font-weight:700}
header h1{color:var(--or);font-size:clamp(30px,8.5vw,44px);font-weight:800;text-shadow:0 0 20px #f5b94266}
.hello{color:var(--od);font-weight:700;margin-top:4px}
.lvl{display:flex;justify-content:center;gap:8px;margin:12px 0 4px;flex-wrap:wrap}.lvl button{border:1px solid #f5b94299;background:transparent;color:var(--tx);border-radius:99px;padding:7px 13px;font-size:14px}
.lvl button.on{background:var(--or);color:var(--nuit);font-weight:800}
.prog{margin:10px auto 0;max-width:420px}.bar{height:12px;border-radius:99px;background:#ffffff1c;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5b942,#ffe3a3);transition:width .6s}
.prog p{margin:6px 0 0;text-align:center;color:var(--t2);font-weight:700}
.tonight{margin:14px auto 0;max-width:420px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#3a2a7d,#241a5e);border:1px solid #f5b94266;border-radius:18px;padding:12px 14px;width:100%;color:var(--tx);text-align:left}
.tonight b{color:var(--or);font-family:Poppins,system-ui;font-size:26px;min-width:44px;text-align:center}
.tonight span{font-size:14px;color:var(--t2)}.tonight strong{display:block;color:var(--tx);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px;margin:22px auto 0;max-width:520px;position:relative}
.grid:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,transparent 3px);pointer-events:none}
.l{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;color:var(--tx);position:relative}
.l svg{width:78%;max-width:58px;height:auto;transition:transform .3s,filter .4s}
.l .b{fill:#3b2f7a;stroke:#f5b942;stroke-width:3}.l .w{fill:#2a2160}
.l.lit .b{fill:#f5b942}.l.lit .w{fill:#fff2c4}.l.lit svg{filter:drop-shadow(0 0 12px #ffd66ee6);animation:sw 3s ease-in-out infinite}
.l.today svg{transform:scale(1.08)}.l.today .n{box-shadow:0 0 0 3px var(--or)}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.l .n{margin-top:-2px;width:28px;height:28px;border-radius:50%;background:var(--cr);color:var(--nuit);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.stb{display:flex;justify-content:center;margin:20px 0 4px}.stb button{background:none;border:0;font-size:48px;color:#4b3f8f;line-height:1}.stb button.lit{color:var(--or);text-shadow:0 0 16px #ffd66e}
.note{text-align:center;color:var(--t2);font-size:14px;margin:4px 12px 0}
.ov{position:fixed;inset:0;background:#0a0720d9;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.ov.on{display:flex}
.card{width:100%;max-width:440px;background:var(--cr);color:var(--nuit);border-radius:22px;overflow:hidden;border:3px solid var(--or);box-shadow:0 0 40px #f5b94255;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.ch{position:relative;background:linear-gradient(160deg,#2b2170,#191345);padding:16px 16px 14px 92px;min-height:96px;color:var(--tx)}
.ch:after{content:"☾";position:absolute;right:16px;top:8px;color:var(--or);font-size:30px}
.med{position:absolute;left:14px;top:12px;width:66px;height:66px;border-radius:50%;background:var(--cr);border:3px solid var(--or);display:flex;align-items:center;justify-content:center;color:var(--nuit);font:800 28px Poppins,system-ui}
.tag{display:inline-flex;align-items:center;gap:5px;color:var(--nuit);font-size:11px;font-weight:800;text-transform:uppercase;border-radius:99px;padding:3px 10px 3px 7px}.tag svg{width:15px;height:15px}
.ch h2{margin-top:6px;font-size:21px;line-height:1.15}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}.cb h3{font-size:14px;color:#9a6b0b}.cb p{margin:0;font-size:17px;line-height:1.45}
.src{font-size:12px;opacity:.65}.vid{font-size:13px;color:#6b4a07;font-weight:700}
.acts{display:flex;gap:8px;margin-top:6px}.acts button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px}
.ok{background:var(--or);color:var(--nuit)}.no{background:#e8e0f7;color:var(--nuit)}
.form{width:100%;max-width:440px;background:linear-gradient(170deg,#2b2170,#191345);border:2px solid var(--or);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;animation:pop .35s}
.form h2{color:var(--or);text-align:center;font-size:24px}.form p{margin:0;text-align:center;color:var(--t2)}
.form label{font-weight:800;font-size:15px}.form input,.form select{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid #f5b94288;background:#ffffff12;color:var(--tx);font-size:17px}
.form select option{color:#000}.seg{display:flex;gap:8px;margin-top:6px}.seg button{flex:1;padding:12px;border-radius:12px;border:1px solid #f5b94288;background:transparent;color:var(--tx);font-weight:800;font-size:16px}.seg button.on{background:var(--or);color:var(--nuit)}
.form .ok{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:17px}.link{background:none;border:0;color:var(--t2);text-decoration:underline;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--or);color:var(--nuit);font-weight:800;padding:12px 18px;border-radius:99px;transition:transform .4s;z-index:20;text-align:center;max-width:92vw}.toast.on{transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.dip{width:100%;max-width:560px;background:var(--cr);color:var(--nuit);border-radius:20px;padding:10px;border:3px solid var(--or);animation:pop .5s}
.dip .in{border:2px dashed #d9a640;border-radius:14px;padding:22px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#fff2c4,transparent 60%)}
.dip small{letter-spacing:.2em;text-transform:uppercase;color:#9a6b0b;font-weight:800;font-size:11px}
.dip h2{font-size:clamp(26px,7vw,36px);margin:4px 0}.dip .who{font:800 clamp(26px,8vw,40px) Poppins,system-ui;color:#c58a12;margin:6px 0}
.dip p{margin:6px 0;font-size:17px;line-height:1.5}.dip .seal{margin:14px auto 4px;width:92px;height:92px;border-radius:50%;background:radial-gradient(#ffe7a6,#f5b942);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px Poppins,system-ui;box-shadow:0 0 0 6px #f5b94255}
.dip .seal span{font-size:10px;letter-spacing:.1em}.dip .sig{display:flex;gap:20px;margin-top:18px;font-size:13px}.dip .sig div{flex:1;border-top:1px solid var(--nuit);padding-top:4px}
.dact{display:flex;gap:8px;margin-top:10px}.dact button{flex:1;border:0;border-radius:14px;padding:13px;font-weight:800}
@media print{body{background:#fff}.app,.sky,.dact,#fx,.toast{display:none!important}.ov{display:none!important}.ov.print{display:flex!important;position:static;background:#fff}.dip{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="sky"></div>

 <div class="top"><div class="kids" id="kids"></div><div><button class="ico" id="add" title="Ajouter un enfant">＋</button> <button class="ico" id="set" title="Réglages">⚙</button></div></div>
 <header><small>Le calendrier du Ramadan</small><h1>Allume ta lanterne</h1><div class="hello" id="hello"></div></header>

<script>
const M=[[1, "islam", "La lune du Ramadan", "À la tombée de la nuit, cherche la lune avec un parent et dessine-la dans ton passeport. Ciel couvert ? Dessine-la de mémoire.", "Dessine la lune chaque soir de la semaine pour la voir grandir. Apprends que le Ramadan est le mois où le Coran a commencé à être révélé.", "Coran 2:185"], [2, "bonnes", "Le sourire", "Jeu du sourire : souris à chaque personne de la maison et compte sur tes doigts.", "Fais sourire 3 personnes (un compliment, une gentille surprise) et raconte-le au dîner. Sourire à son frère est une aumône.", "Tirmidhî 1956"], [3, "invocations", "Bismillâh et la main droite", "Dis « Bismillâh » avant de manger et mange de la main droite. Un parent joue au détective !", "Apprends les 3 conseils du Prophète (paix sur lui) à un garçon : dire Bismillâh, manger de la main droite, manger ce qui est devant soi. Si tu as oublié : « Bismillâhi awwalahou wa âkhirahou ».", "Boukhârî 5376, Mouslim 2022, Abû Dâwoud 3767"], [4, "prophetes", "Adam", "Regarde l'épisode d'Adam, puis dis « pardon » à quelqu'un pour une petite bêtise.", "Apprends le début de l'invocation d'Adam et Hawwâ : « Rabbanâ dhalamnâ anfousanâ ». Pourquoi faut-il du courage pour demander pardon ?", "Coran 7:23"], [5, "bienfaits", "L'eau", "Chasse à l'eau : trouve 5 endroits de la maison où il y a de l'eau et dis « Al-hamdou lillâh » devant chacun.", "Fais un trait à chaque fois que tu utilises l'eau aujourd'hui, compte le soir et écris une phrase de merci.", "Coran 21:30"], [6, "solidarite", "Le ftour", "Apporte une datte et un verre d'eau à chaque personne qui rompt son jeûne.", "Prépare l'assiette de dattes, sers les jeûneurs en premier et dis avec eux l'invocation de la rupture du jeûne.", "Tirmidhî 807, Abû Dâwoud 2357"], [7, "creatif", "Ma lanterne en papier", "Colorie la lanterne du kit, puis plie-la avec un parent.", "Fabrique une lanterne avec une feuille pliée et découpée en bandes (ciseaux à bouts ronds, avec un adulte). Écris dessus ton invocation préférée.", ""], [8, "coran", "Al-Fâtiha", "Écoute un parent réciter Al-Fâtiha et répète le premier verset en tapant doucement dans tes mains.", "Récite Al-Fâtiha, ou apprends-en 3 versets. On la récite dans chaque unité de prière.", "Coran 1, Boukhârî 756"], [9, "prophetes", "Nouh", "Regarde l'épisode de Nouh, puis construis une « arche » avec des coussins et ranges-y tes doudous deux par deux.", "Raconte l'histoire en 4 dessins, comme une bande dessinée. Nouh a appelé son peuple pendant 950 ans sans abandonner.", "Coran 29:14"], [10, "famille", "Les bonnes paroles", "Pendant le repas, chacun dit une gentille chose à son voisin de table.", "Compteur de bonnes paroles : une feuille sur le frigo, un trait à chaque mot gentil. Apprends : « qu'il dise du bien ou qu'il se taise ».", "Boukhârî 6018, Mouslim 47"], [11, "islam", "Les 5 piliers", "Les 5 doigts de la main : le parent nomme un pilier par doigt, tu répètes en montrant le doigt.", "Dessine une maison posée sur 5 piliers et écris leur nom : chahâda, prière, zakât, jeûne du Ramadan, pèlerinage.", "Boukhârî 8, Mouslim 16"], [12, "bonnes", "Le chemin dégagé", "Ramasse ce qui traîne par terre dans le couloir pour que personne ne tombe.", "Fais le tour de la maison pour enlever ce qui gêne le passage. Retirer un obstacle du chemin fait partie de la foi.", "Mouslim 35"], [13, "bienfaits", "Le soleil et la lune", "Jeu des ombres : avec la lumière d'une fenêtre ou d'un téléphone, fais des formes avec tes mains sur le mur.", "Note 3 soirs de suite l'heure du coucher du soleil (l'heure du ftour) : elle change chaque jour ! Lis le verset sur le soleil et la lune.", "Coran 55:5"], [14, "prophetes", "Ibrahim", "Regarde l'épisode d'Ibrahim, puis joue à « recevoir des invités » : sers un verre d'eau à chaque personne de la famille.", "Prépare toi-même un petit plateau d'accueil (eau, dattes) pour la famille ou un invité, comme Ibrahim avec ses hôtes.", "Coran 51:24-27"], [15, "invocations", "Dormir et se réveiller", "Au coucher, dis avec un parent : « Bismika llâhoumma amoûtou wa ahyâ ».", "Apprends aussi l'invocation du réveil : « Al-hamdou lillâhi lladhî ahyânâ ba‘da mâ amâtanâ wa ilayhi n-nouchoûr ».", "Boukhârî 6312, 6314"], [16, "solidarite", "Le sac du partage", "Choisis un jouet ou un vêtement en bon état que tu n'utilises plus, pour le donner.", "Trie ton placard avec un parent et prépare un sac pour une famille ou une association. Peux-tu donner aussi une chose que tu aimes encore ?", "Coran 3:92"], [17, "creatif", "L'arbre des bienfaits", "Dessine un arbre. Sur chaque feuille, le parent écrit une chose pour laquelle tu dis merci à Allah.", "Écris toi-même 10 bienfaits sur les feuilles, puis lis le verset : les bienfaits d'Allah sont impossibles à compter.", "Coran 16:18"], [18, "coran", "Al-Ikhlâs", "Répète « Qoul houwa llâhou ahad » avec un parent, en levant un doigt sur « ahad » (Unique).", "Mémorise les 4 versets de la sourate. Le Prophète (paix sur lui) a dit qu'elle équivaut à un tiers du Coran.", "Coran 112, Boukhârî 5013"], [19, "prophetes", "Youssouf", "Regarde l'épisode de Youssouf, puis jeu du pardon : chacun dit à l'autre « je te pardonne » avec un câlin.", "Retiens la phrase de Youssouf à ses frères : « Lâ tathrîba ‘alaykoumou l-yawm » (aucun reproche contre vous aujourd'hui). Raconte une fois où tu as pardonné.", "Coran 12:92"], [20, "famille", "La soirée sans écran", "Une heure sans écran pour toute la famille, avec les devinettes des bonus.", "Organise toi-même la soirée : choisis 2 jeux dans les bonus et anime-les pour la famille.", ""], [21, "invocations", "Les dernières nuits", "Répète avec un parent le début : « Allâhoumma innaka ‘afouwwoun ».", "Apprends l'invocation entière : « Allâhoumma innaka ‘afouwwoun touhibbou l-‘afwa fa‘fou ‘annî ». La Nuit du Destin est meilleure que mille mois.", "Tirmidhî 3513, Coran 97:3"], [22, "prophetes", "Younous", "Regarde l'épisode de Younous, puis jeu de la baleine : sous une couverture, dans le noir, dis doucement avec un parent « Lâ ilâha illâ anta ».", "Apprends l'invocation entière : « Lâ ilâha illâ anta, soubhânaka, innî kountou mina dh-dhâlimîn ».", "Coran 21:87, Tirmidhî 3505"], [23, "bonnes", "Pour maman", "Fais une surprise à maman : un dessin, un câlin et une petite aide (mettre la table, ranger tes chaussures).", "Apprends le hadith où le Prophète (paix sur lui) répond trois fois « ta mère », puis « ton père ». Fais 3 gestes pour maman aujourd'hui, et un pour papa.", "Boukhârî 5971, Mouslim 2548"], [24, "islam", "La zakât al-fitr", "Sois là quand un parent donne la zakât al-fitr : c'est pour que les familles pauvres fêtent l'Aïd elles aussi.", "Elle est donnée pour chaque musulman de la famille, même les enfants, avant la prière de l'Aïd. Demande à tes parents comment la famille la donne.", "Boukhârî 1503"], [25, "bienfaits", "La nourriture", "Au ftour, nomme 5 aliments sur la table et dis « Al-hamdou lillâh » pour chacun.", "Cherche d'où vient chaque aliment du repas (arbre, terre, animal, mer) et lis le verset : « Que l'homme regarde sa nourriture ».", "Coran 80:24"], [26, "creatif", "La carte de l'Aïd", "Dessine une carte de l'Aïd pour un grand-parent, un voisin ou la maîtresse.", "Écris un message de vœux dans la carte, avec « Taqabbala llâhou minnâ wa minkoum » (qu'Allah accepte de nous et de vous).", "Formule des compagnons"], [27, "solidarite", "Le lien familial", "Appelle un grand-parent, une tante ou un oncle, et dis-lui un mot appris dans le calendrier.", "Dessine l'arbre de ta famille, puis appelle quelqu'un de la famille que tu n'as pas eu depuis longtemps.", "Boukhârî 5986, Mouslim 2557"], [28, "coran", "Le petit récital", "Récite devant la famille ce que tu as appris (Bismillâh, début de la Fâtiha, Qoul houwa llâhou ahad). Applaudissements !", "Récite Al-Fâtiha et Al-Ikhlâs devant la famille, puis enseigne un verset à un plus petit. « Le meilleur d'entre vous apprend le Coran et l'enseigne. »", "Boukhârî 5027"], [29, "aid", "La veille de l'Aïd", "À faire le soir où l'Aïd est annoncé. Prépare tes habits de l'Aïd et accroche la guirlande de lanternes du kit.", "À faire le soir où l'Aïd est annoncé. Apprends le takbîr : « Allâhou akbar, Allâhou akbar, lâ ilâha illâ llâh, wa llâhou akbar, Allâhou akbar, wa lillâhi l-hamd ».", "Coran 2:185, formule des compagnons"], [30, "aid", "Le matin de l'Aïd", "Mange quelques dattes (1, 3 ou 5) avant la prière, souhaite « Aïd moubârak » à toute la famille et reçois ton diplôme !", "Le Prophète (paix sur lui) mangeait des dattes en nombre impair avant de sortir pour la prière de l'Aïd al-Fitr. Prends un chemin différent à l'aller et au retour.", "Boukhârî 953, 986"]],C={"bonnes": ["Bonnes actions", "#F4B6C2", "<path d=\"M12 20.5s-7.5-4.6-9.6-9.2A4.9 4.9 0 0 1 12 6.6a4.9 4.9 0 0 1 9.6 4.7C19.5 15.9 12 20.5 12 20.5z\"/>"], "islam": ["Découverte de l'islam", "#8FA8D6", "<path d=\"M3.5 20.5h17M5.5 20.5v-6h13v6M5.5 14.5a6.5 6.5 0 0 1 13 0M12 8V3.8M10.6 5h2.8M10 20.5v-3a2 2 0 0 1 4 0v3\"/>"], "prophetes": ["Histoires des prophètes", "#8CCFA8", "<path d=\"M12 1.8v2.2M9 4h6l1.2 3H7.8zM7.8 7h8.4v10H7.8zM10 17h4l-1 3h-2zM10 15v-3.5a2 2 0 0 1 4 0V15\"/>"], "invocations": ["Invocations authentiques", "#9ED3EE", "<path d=\"M9.5 21v-5.5L6.2 10a1.4 1.4 0 0 1 2.3-1.5l1.8 2.3V4.3a1.1 1.1 0 0 1 2.2 0V12M14.5 21v-5.5l3.3-5.5a1.4 1.4 0 0 0-2.3-1.5l-1.8 2.3V4.3a1.1 1.1 0 0 0-2.2 0\"/>"], "bienfaits": ["Bienfaits d'Allah", "#F5D07A", "<circle cx=\"12\" cy=\"12\" r=\"4.2\"/><path d=\"M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8\"/>"], "creatif": ["Activités créatives", "#F7B98B", "<path d=\"M4 20l1-4.2L16.3 4.5a2 2 0 0 1 2.9 0l.3.3a2 2 0 0 1 0 2.9L8.2 19zM14.5 6.3l3.2 3.2\"/>"], "famille": ["Défis en famille", "#F2A091", "<path d=\"M3 11.2L12 4l9 7.2M5.2 9.6V20h13.6V9.6M10 20v-5h4v5\"/>"], "solidarite": ["Solidarité et partage", "#C7B5E6", "<path d=\"M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7C10.5 3.5 6.5 3.8 8 6.5c.7 1 2.5.5 4 .5M12 7c1.5-3. let parts=[];const cv=$('fx'),cx=cv.getContext('2d');
