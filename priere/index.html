.wv{opacity:0;transform-box:fill-box}
.go .wv.vy{animation:sy 1.25s ease-in-out}.go .wv.vx{animation:sx 1.25s ease-in-out}.go .wv.vxr{animation:sxr 1.25s ease-in-out}
