<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>SIMULATION — portail de facturation factice</title>
<style>@view-transition{navigation:auto}body{font:17px system-ui;background:#fff3f5;color:#3d0613;max-width:480px;margin:40px auto;padding:0 16px}button{font:800 17px system-ui;padding:12px 18px;border-radius:12px;border:0;margin:6px 6px 0 0;cursor:pointer}</style></head>
<body>
<h1>⚠️ SIMULATION LOCALE — portail de facturation factice</h1>
<p>En vrai, Stripe affiche ici le moyen de paiement et les factures. Rien de réel ici.</p>
<button id="fin">Simuler la fin de période (abonnement terminé)</button> <a href="/compte/">← Retour à l'Espace famille</a>
<p id="etat"></p>
<script>
document.getElementById('fin').onclick = async () => { const r = await fetch('/api/_emulateur/fin-abonnement', { method: 'POST', headers: { 'X-LDN': '1' } }); document.getElementById('etat').textContent = r.ok ? 'Abonnement terminé (simulation).' : 'Aucun abonnement.'; };
</script>
</body></html>
