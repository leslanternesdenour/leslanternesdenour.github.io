<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>SIMULATION — paiement factice</title>
<style>@view-transition{navigation:auto}body{font:17px system-ui;background:#fff3f5;color:#3d0613;max-width:480px;margin:40px auto;padding:0 16px}h1{font-size:22px}button{font:800 17px system-ui;padding:12px 18px;border-radius:12px;border:0;margin:6px 6px 0 0;cursor:pointer}#payer{background:#635bff;color:#fff}</style></head>
<body>
<h1>⚠️ SIMULATION LOCALE — page de paiement factice</h1>
<p>Cette page remplace Stripe Checkout sur l'ordinateur de développement. <b>Aucun paiement, aucune carte, aucun service réel.</b> Elle envoie au serveur un webhook signé, exactement comme Stripe en mode test.</p>
<p>Session : <code id="s"></code></p>
<button id="payer">Payer (simulation)</button><button id="annuler">Annuler</button>
<p id="etat"></p>
<script>
const s = new URLSearchParams(location.search).get('session'); document.getElementById('s').textContent = s;
async function go(action) {
  const r = await fetch('/api/_emulateur/paiement', { method: 'POST', headers: { 'X-LDN': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ session: s, action }) });
  const j = await r.json(); if (j.redirection) location.href = j.redirection; else document.getElementById('etat').textContent = 'Erreur : ' + (j.erreur || r.status);
}
document.getElementById('payer').onclick = () => go('payer'); document.getElementById('annuler').onclick = () => go('annuler');
</script>
</body></html>
