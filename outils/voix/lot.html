<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Écoute d'un lot de voix · outil interne</title>
<style>:root{color-scheme:dark}body{font:16px Nunito,system-ui,sans-serif;background:#191345;color:#f4efff;margin:0;padding:16px;max-width:800px;margin-inline:auto}
h1{font-size:20px}.n{color:#c9bff0;font-size:14px}.t{border:1px solid #3a2a7d;border-radius:12px;padding:10px;margin:10px 0}.t.ok{border-color:#3fbf7f}.t.ko{border-color:#e5605a}
.k{font-weight:800}.tx{margin:6px 0;line-height:1.4}.l{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid #6a55c9;background:#2b1f69;color:#fff;cursor:pointer;min-height:44px}
button.on{background:#3fbf7f;color:#102;border-color:#3fbf7f}button.ko.on{background:#e5605a;border-color:#e5605a;color:#fff}
.bar{position:sticky;top:0;background:#191345;padding:8px 0;border-bottom:1px solid #3a2a7d}audio{width:100%}</style></head><body>
<h1 id="titre">Écoute d'un lot</h1>
<p class="n">Voix de la narratrice. Pour chaque phrase : écoute, vérifie que ça dit <b>exactement</b> le texte, que la prononciation est juste (surtout les mots arabes), puis <b>✓ je valide</b> ou <b>✗ je refuse</b> avec une remarque. Rien n'est branché dans les jeux avant ton accord.</p>
<div class="bar"><span id="cpt" class="n"></span> <button id="copie">Copier le résultat</button></div>
<div id="liste"></div>
<textarea id="texte" rows="8" style="display:none;width:100%;box-sizing:border-box;background:#120e33;color:#fff;border:1px solid #6a55c9;border-radius:8px;padding:8px;font:14px monospace" readonly></textarea>
<script>
const N=new URLSearchParams(location.search).get('n')||'1',CLE='lot'+N;let ST={};try{ST=JSON.parse(localStorage.getItem(CLE)||'{}')}catch(e){}
const sauve=()=>{try{localStorage.setItem(CLE,JSON.stringify(ST))}catch(e){}};let L=[];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function dessiner(){const Z=document.getElementById('liste');Z.innerHTML='';let ok=0,ko=0;
 for(const x of L){const e=ST[x.cle]||{};if(e.v==='ok')ok++;if(e.v==='ko')ko++;const d=document.createElement('div');d.className='t '+(e.v||'');
  d.innerHTML=`<div class="k">${esc(x.cle)}</div><div class="tx"><b>Texte du jeu :</b> ${esc(x.texte)}</div>${x.texte!==x.texte_voix?`<div class="tx n"><b>Envoyé à la voix :</b> <span dir="auto">${esc(x.texte_voix)}</span></div>`:''}<audio controls preload="none" src="lots/${esc(x.fichier)}"></audio>
  <div class="l"><button data-r="ok" class="${e.v==='ok'?'on':''}">✓ je valide</button><button data-r="ko" class="ko ${e.v==='ko'?'on':''}">✗ je refuse</button></div>
  <input type="text" placeholder="Remarque (mot mal prononcé, phrase coupée…)" style="width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #6a55c9;background:#120e33;color:#fff;font:inherit" value="${esc(e.c||'')}">`;
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ST[x.cle]={...ST[x.cle],v:b.dataset.r};sauve();dessiner()});
  d.querySelector('input').onchange=ev=>{ST[x.cle]={...ST[x.cle],c:ev.target.value};sauve()};Z.appendChild(d)}
 document.getElementById('cpt').textContent=ok+' validées · '+ko+' refusées · '+(L.length-ok-ko)+' à juger'}
document.getElementById('copie').onclick=async()=>{let s='RÉSULTAT LOT '+N+' (voix narratrice)\n';for(const x of L){const e=ST[x.cle]||{};s+=x.cle+' : '+(e.v==='ok'?'VALIDE':e.v==='ko'?'REFUSE':'non jugé')+(e.c?' — '+e.c:'')+'\n'}
 const z=document.getElementById('texte');z.style.display='block';z.value=s;z.select();try{await navigator.clipboard.writeText(s);document.getElementById('copie').textContent='Copié ✓ — colle-le dans le chat'}catch(e){document.getElementById('copie').textContent='Sélectionné : copie-le à la main'}};
document.getElementById('titre').textContent='Écoute du lot '+N;
fetch('lots/lot'+N+'.json').then(r=>r.json()).then(j=>{L=j;dessiner()});
</script></body></html>
