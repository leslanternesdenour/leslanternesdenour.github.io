<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],A=$('#app');

 if(c){const go=()=>{try{AU.currentTime=c[1]}catch(e){}const p=AU.play();if(p&&p.catch)p.catch(()=>tts(t));AUt=setTimeout(()=>AU.pause(),(c[2]-c[1])*1000+120)};
  if(AU.dataset.f!==c[0]){AU.dataset.f=c[0];AU.src='voix/'+c[0];AU.addEventListener('loadedmetadata',go,{once:true});AU.load()}else go();return}
 tts(t)}
const ISL=/[âîûÂÎÛ‘ʿʾ]|\b(allah|bismi|ramadan|coran|a[iï]d\b|zak|sourate|f[aâ]tiha|nouh|adam|ibrahim|youss?ouf|younous|mouss?a|ftour|kaaba|qibla|sal[aâ]t|rak|soujou|roukou|takb|tachah|tasl|wudu|mach|inch|assal|soubh|rabb|alhamd|akbar|astagh|jibr|hajj|chah[aâ]da|fajr|dhohr|asr\b|maghrib|icha|sahour|adh[aâ]n)/i;
function tts(t){if(ISL.test(String(t)))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'').replace(/[؀-ۿً-ٟ]+/g,''));u.lang='fr-FR';u.rate=.92;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let T=[];const later=(f,ms)=>T.push(setTimeout(f,ms));const stopAll=()=>{T.forEach(clearTimeout);T=[];stopVoice()};

/* ---------- décor ---------- */
$('#deco').innerHTML=[[6,12],[88,8],[18,40],[94,34],[4,70],[90,62],[50,4],[70,88],[12,90]].map(([x,y],i)=>`<span class="st" style="left:${x}%;top:${y}%;font-size:${12+i%3*6}px;animation-delay:${-i*.5}s">${i%4===3?'☾':'✦'}</span>`).join('');
const LT=(f,w)=>`<g fill="${f}" stroke="#d9952a" stroke-width="2.5"><path d="M30 32 38 16h24l8 16z"/><rect x="26" y="32" width="48" height="8" rx="2"/><rect x="28" y="40" width="44" height="60" rx="3"/><rect x="24" y="100" width="52" height="8" rx="2"/><path d="M34 108 40 120h20l6-12z"/></g><path d="M40 96V66a10 10 0 0 1 20 0v30z" fill="${w}"/>`;

/* ---------- Nour, la petite goutte ---------- */
function nour(m){const mouth=m==='wow'?'<ellipse cx="60" cy="106" rx="9" ry="10" fill="#7a2c3b"/><ellipse cx="60" cy="110" rx="5" ry="4" fill="#ff8fa3"/>':m==='oh'?'<ellipse cx="60" cy="106" rx="5" ry="6" fill="#7a2c3b"/>':'<path d="M47 101q13 14 26 0" fill="#7a2c3b"/><path d="M52 106q8 5 16 0" fill="#ff8fa3"/>';
 return `<svg class="nour" viewBox="0 0 120 150" role="img" aria-label="Nour la petite goutte"><defs><linearGradient id="ng${m||''}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8be3ef"/><stop offset="1" stop-color="#1fa3c9"/></linearGradient></defs>
 <ellipse cx="60" cy="144" rx="30" ry="5" fill="#1d8f9c" opacity=".18"/>
 <path d="M60 6C55 18 16 62 16 94a44 44 0 0 0 88 0C104 62 65 18 60 6z" fill="url(#ng${m||''})" stroke="#1784a8" stroke-width="3"/>
 <path d="M38 70c4-12 10-22 16-30" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55" fill="none"/>
 <g class="sv-visage"><ellipse cx="45" cy="86" rx="8" ry="10" fill="#173a5e"/><ellipse cx="75" cy="86" rx="8" ry="10" fill="#173a5e"/><circle cx="48" cy="82" r="3" fill="#fff"/><circle cx="78" cy="82" r="3" fill="#fff"/>
 <circle cx="34" cy="100" r="6" fill="#ff9fb2" opacity=".7"/><circle cx="86" cy="100" r="6" fill="#ff9fb2" opacity=".7"/>${mouth}</g>
 <path d="M84 34a10 10 0 1 0 0 14a12 12 0 0 1 0-14z" fill="#f5b942"/></svg>`}

 A.innerHTML=topbar('Apprendre les ablutions')+`<div class="dots">${ST.map((x,j)=>`<i class="${j<i?'d':j===i?'c':''}"></i>`).join('')}</div>

 ${s.ph.length?`<div class="cnt" id="cnt">${s.ph.map(p=>`<span class="ph">${p.l} ${dropI.repeat(p.k)}</span>`).join('')}</div>`:''}

 wire();$('#pv').onclick=()=>i?go('learn',i-1):go('home');$('#nx').onclick=()=>i<8?go('learn',i+1):go('done');
 $('#rd').onclick=()=>say(s.t+'. '+s.txt,'s'+i);$('#bul').style.cursor='pointer';$('#bul').onclick=()=>say(s.tip,'t'+i);$('#rp').onclick=()=>{stopAll();anim(s)};
 say(`Étape ${i+1}. ${s.t}. ${s.txt} ${s.c}.`,'s'+i);anim(s)}
function anim(s){if(!s.ph.length)return;const sv=$('#art svg');let pi=0,k=0;
 const reset=()=>$$('#cnt .dr').forEach(d=>d.classList.remove('on'));
 const tick=()=>{if(pi>=s.ph.length){later(()=>{reset();pi=0;k=0;tick()},2600);return}
  const p=s.ph[pi],z=sv.querySelector(`[data-z="${p.z}"]`);if(z){z.classList.remove('go');void z.getBoundingClientRect();z.classList.add('go')}
  const d=$$('#cnt .ph')[pi].querySelectorAll('.dr')[k];d.classList.add('on');
  const pop=$('#pop');pop.textContent=k+1;pop.classList.remove('on');void pop.offsetWidth;pop.classList.add('on');
  k++;if(k>=p.k){pi++;k=0}later(tick,1500)};
 later(tick,700)}

 <div class="tr">Ach-hadou an lâ ilâha illa Llâh, wahdahou lâ charîka lah, wa ach-hadou anna Mouhammadan ‘abdouhou wa rasoûlouh.</div>

 <button class="big b3" id="g2"><span class="ic">✋</span><span>Combien de fois ?<small>${st('g2')}</small></span></button>
 <button class="big b3" id="g3"><span class="ic">👉</span><span>Montre-moi la bonne partie<small>${st('g3')}</small></span></button>
 <button class="big b3" id="g4"><span class="ic">🔎</span><span>Les erreurs à éviter<small>${st('g4')}</small></span></button></div>
 ${['g1','g2','g3','g4'].every(k=>prog[k]===3)?bubble("Tu as toutes les étoiles ! Tu es un vrai champion des ablutions !","ok"):bubble("Choisis un jeu ! Gagne les 12 étoiles !")}`;
 wire();['g1','g2','g3','g4'].forEach(k=>$('#'+k).onclick=()=>go(k));say('Choisis un jeu !','games')}
function result(k,ok,tot){const s=ok>=tot?3:ok>=tot*.6?2:1;if(!prog[k]||s>prog[k])prog[k]=s;save();burst(s===3?140:60,1);
 const msg=s===3?"Parfait ! Tu as toutes les étoiles !":s===2?"Très bien ! Encore un petit effort pour la 3e étoile.":"Bravo d'avoir essayé ! On rejoue ?";
 A.innerHTML=topbar('Résultat')+`<div class="win">${nour('wow')}<h2>${s===3?"Machâ'Allah !":'Bravo !'}</h2><div class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><p class="txt">${msg}</p></div>
 <button class="go2" id="ag">🔁 Rejouer</button><button class="go2" style="background:#fff;color:var(--tx);box-shadow:0 5px 0 #b7e3ec" id="og">🎮 Les autres jeux</button>`;
 wire();$('#ag').onclick=()=>go(k);$('#og').onclick=()=>go('games');say(msg,'r'+s)}

/* JEU 1 : l'ordre */
const HINT=["Tout commence dans ton cœur…","Avant de toucher l'eau, on dit une petite phrase avec le nom d'Allah.","D'abord, on lave ce qui va porter l'eau…","Maintenant, ce qui sert à manger et à parler.","Juste au-dessus de la bouche, ce qui sert à sentir les fleurs…","Tout ce qu'on voit dans le miroir, du front au menton !","De la main jusqu'au coude, en commençant par la droite.","On passe les mains mouillées une seule fois en haut… et derrière les joues !","On termine tout en bas, avec ce qui sert à marcher !"];
function g1(){const order=ST.map(s=>s.k);let placed=0,err=0;const pool=shuffle(order);
 const draw=(msg,c)=>{A.innerHTML=topbar('Remets dans l\'ordre')+`<div class="gh"><h2>Dans quel ordre ?</h2></div>
  <div class="slots">${order.map((k,i)=>i<placed?`<div class="slot f">${svg(k)}</div>`:`<div class="slot">${i+1}</div>`).join('')}</div>
  ${bubble(msg,c)}<div class="pool">${pool.map(k=>order.indexOf(k)<placed?'':`<button class="pc" data-k="${k}">${svg(k)}${LBL[k]}</button>`).join('')}</div>`;
  wire();$$('.pc').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k===order[placed]){placed++;burst(20);if(placed===9)return later(()=>result('g1',err===0?9:err<=2?6:3,9),500);
    const m=["Bravo !","Oui !","C'est ça !","Super !"][placed%4]+` Et maintenant, l'étape ${placed+1} ?`;draw(m,'ok');say(m,'g1ok')}
   else{err++;b.classList.add('sh');const m='Pas encore ! Petit indice : '+HINT[placed];$('#bul').textContent=m;$('#bul').className='bul ko';say(m,'h'+placed);later(()=>b.classList.remove('sh'),500)}})};
 draw("Touche les cartes dans le bon ordre, de la 1re à la 9e étape !");say("Touche les cartes dans le bon ordre, de la première à la neuvième étape !",'g1i')}

/* JEU 2 : combien de fois */
function g2(){const Q=shuffle([['mains',3],['bouche',3],['nez',3],['visage',3],['bras',3],['tete',1],['oreilles',1],['pieds',3]]);let i=0,ok=0;
 const ask=()=>{const[k,n]=Q[i];A.innerHTML=topbar('Combien de fois ?')+`<div class="gh"><h2>Combien de fois ?</h2><span class="badge">Question ${i+1} / ${Q.length}</span></div>
  <div class="qart">${svg(k)}</div><div class="gh ql">${LBL[k]}${k==='bras'||k==='pieds'?' (chaque côté)':''}</div>
  <div class="nums">${[1,2,3].map(x=>`<button data-n="${x}">${x}</button>`).join('')}</div><div id="fb"></div>`;
  wire();const q=`Combien de fois on lave ${LBL[k].toLowerCase()} ? Un, deux, ou trois ?`.replace('on lave la tête','on passe les mains sur la tête').replace('on lave les oreilles','on essuie les oreilles');say(q,'q2_'+k);
  $$('.nums button').forEach(b=>b.onclick=()=>{if($('#fb').innerHTML)return;const x=+b.dataset.n,good=x===n;if(good)ok++;b.classList.add(good?'okk':'bad');if(!good)$(`.nums button[data-n="${n}"]`).classList.add('okk');
   const ex=n===1?(k==='tete'?"La tête, on passe les mains mouillées une seule fois.":"Les oreilles, on les essuie une seule fois, avec la tête."):"3 fois, c'est la sunna. Mais une fois bien lavé, c'est déjà valable !";
   const m=(good?'Bravo ! ':'Presque ! ')+ex;if(good)burst(25);$('#fb').innerHTML=bubble(m,good?'ok':'ko')+`<button class="go2" id="nq">${i<Q.length-1?'Suivant ▶':'Voir mes étoiles ⭐'}</button>`;say(m,(good?'g2ok':'g2ko')+(n===3?'3':k==='tete'?'t':'e'));
   $('#nq').onclick=()=>{i++;i<Q.length?ask():result('g2',ok,Q.length)}})};
 ask()}

/* JEU 3 : montre-moi */
function g3(){const W=['mains','bouche','nez','visage','bras','tete','pieds'];
 const R=shuffle([['Par quoi commence-t-on à laver ?','mains','q3_start'],...W.slice(0,-1).map((w,j)=>[`Quelle partie lave-t-on après ${LBL[w].toLowerCase()} ?`.replace('lave-t-on après la tête','lave-t-on après la tête et les oreilles'),W[j+1],'q3_'+w])]);let i=0,ok=0;
 const ask=()=>{const[q,a]=R[i];const opts=shuffle([a,...shuffle(W.filter(x=>x!==a)).slice(0,2)]);
  A.innerHTML=topbar('Montre-moi la bonne partie')+`<div class="gh"><span class="badge">Question ${i+1} / ${R.length}</span></div>${bubble(q)}<div class="opts">${opts.map(k=>`<button class="pc" data-k="${k}">${svg(k)}${LBL[k]}</button>`).join('')}</div><div id="fb"></div>`;
  wire();say(q,R[i][2]);$$('.pc').forEach(b=>b.onclick=()=>{if($('#fb').innerHTML)return;const good=b.dataset.k===a;if(good)ok++;b.classList.add(good?'okk':'bad');if(!good)$(`.pc[data-k="${a}"]`).classList.add('okk');
   const m=good?'Oui, bravo !':`Non, c'est ${LBL[a].toLowerCase()} !`;if(good)burst(25);$('#fb').innerHTML=bubble(m,good?'ok':'ko')+`<button class="go2" id="nq">${i<R.length-1?'Suivant ▶':'Voir mes étoiles ⭐'}</button>`;say(m,good?'g3ok':'g3ko_'+a);
   $('#nq').onclick=()=>{i++;i<R.length?ask():result('g3',ok,R.length)}})};
 ask()}

/* JEU 4 : les erreurs à éviter */
function g4(){const debut=['intention','bismillah'];   /* des ablutions justes commencent TOUJOURS par l'intention, puis Bismillâh */
 const full=[...debut,'mains','bouche','nez','visage','bras','tete','pieds'];
 const S=shuffle([
  {id:'nez',seq:full.filter(x=>x!=='nez'),a:"Il a oublié le nez",o:["Il a oublié les pieds","Tout est juste"]},
  {id:'bras',seq:[...debut,'mains','bouche','nez','visage',['bras','G'],['bras','D'],'tete','pieds'],a:"Il a commencé par le bras gauche",o:["Il a oublié la bouche","Tout est juste"]},
  {id:'pieds',seq:full.filter(x=>x!=='pieds'),a:"Il a oublié les pieds",o:["Il a oublié le visage","Tout est juste"]},
  {id:'ordre',seq:[...debut,'mains','bouche','nez','visage','bras','pieds','tete'],a:"Il a lavé les pieds avant la tête",o:["Il a oublié les mains","Tout est juste"]},
  {id:'oreilles',seq:[...debut,'mains','bouche','nez','visage','bras',['tete','sans oreilles'],'pieds'],a:"Il a oublié les oreilles",o:["Il a oublié le nez","Tout est juste"]},
  {id:'juste',seq:full,a:"Tout est juste !",o:["Il a oublié le nez","Il a commencé par les pieds"]},
  {id:'visage',seq:[...debut,'visage','mains','bouche','nez','bras','tete','pieds'],a:"Il a lavé le visage avant les mains",o:["Il a oublié la tête","Tout est juste"]}]);let i=0,ok=0;
 const ask=()=>{const s=S[i],opts=shuffle([s.a,...s.o]);
  A.innerHTML=topbar('Les erreurs à éviter')+`<div class="gh"><span class="badge">Mission ${i+1} / ${S.length}</span></div>${bubble("Regarde bien les ablutions de ce petit. Qu'est-ce qui ne va pas ?")}
  <div class="seq">${s.seq.map(x=>{const[k,t]=Array.isArray(x)?x:[x,''];return `<div class="sq">${svg(k)}${LBL[k]}${t?`<b>${t}</b>`:''}</div>`}).join('')}</div>
  <div class="ans">${opts.map(o=>`<button data-o="${o}">${o}</button>`).join('')}</div><div id="fb"></div>`;
  wire();say("Regarde bien les ablutions de ce petit. Qu'est-ce qui ne va pas ?",'g4i');$$('.ans button').forEach(b=>b.onclick=()=>{if($('#fb').innerHTML)return;const good=b.dataset.o===s.a;if(good)ok++;b.classList.add(good?'okk':'bad');if(!good)$$('.ans button').find(x=>x.dataset.o===s.a).classList.add('okk');
   const m=good?'Bien vu, détective !':`La bonne réponse : ${s.a.replace(' !','')}.`;if(good)burst(25);$('#fb').innerHTML=bubble(m,good?'ok':'ko')+`<button class="go2" id="nq">${i<S.length-1?'Suivant ▶':'Voir mes étoiles ⭐'}</button>`;say(m,good?'g4ok':'g4ko_'+s.id);
   $('#nq').onclick=()=>{i++;i<S.length?ask():result('g4',ok,S.length)}})};
 ask()}

/* ---------- confettis ---------- */
let parts=[],raf=0;const cv=$('#fx'),cx=cv.getContext('2d');
function burst(n,big){cv.width=innerWidth;cv.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:big?Math.random()*cv.width:cv.width/2,y:big?-20-Math.random()*cv.height*.5:cv.height*.45,vx:big?(Math.random()-.5)*1.5:(Math.random()-.5)*9,vy:big?2+Math.random()*3:-3-Math.random()*7,r:3+Math.random()*5,c:['#f5b942','#8fd8ef','#2bb3c0','#fff','#ffb3c1'][i%5],d:Math.random()<.5,l:big?240:80});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0&&p.y<cv.height+30);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;cx.fillStyle=p.c;cx.beginPath();if(p.d){cx.moveTo(p.x,p.y-p.r*1.6);cx.quadraticCurveTo(p.x+p.r,p.y,p.x,p.y+p.r);cx.quadraticCurveTo(p.x-p.r,p.y,p.x,p.y-p.r*1.6)}else cx.arc(p.x,p.y,p.r,0,7);cx.fill()});raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

const SCR={home,learn,done,why,games,g1,g2,g3,g4};
function go(s,...a){stopAll();SCR[s](...a);window.scrollTo(0,0)}
window.__go=go;home();
