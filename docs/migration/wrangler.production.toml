# Configuration Cloudflare Pages de la PRODUCTION (branche « main »). Aucun secret ici.
# Ce fichier est la version « production » de wrangler.toml : il remplace wrangler.toml À LA MISE EN PRODUCTION (voir docs/MIGRATION-PRODUCTION.md).
# Le build refuse « main » tant que ENVIRONNEMENT n'y vaut pas "production" (outils/construire.mjs).
name = "lanternes-de-nour"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
ENVIRONNEMENT = "production"
# Identifiant PUBLIC du projet Firebase (pas un secret). Même projet que la préproduction : mêmes comptes, mêmes familles.
FIREBASE_PROJET = "lanternes-de-nour"

# Secrets (tableau de bord Cloudflare, environnement « Production », type « Secret ») : SESSION_SECRET, FIREBASE_COMPTE_SERVICE, CREATOR_UID.
# Paiement : NE PAS définir STRIPE_* en production tant que l'ouverture des paiements n'est pas décidée (le site affiche alors « Le paiement n'est pas encore ouvert »).
# À L'OUVERTURE DES PAIEMENTS RÉELS (décision du créateur, après régularisation de l'activité et pages légales complètes) :
#   1. Variables publiques, à ajouter ICI dans [vars] avec les identifiants créés dans Stripe en MODE RÉEL (ne jamais reprendre ceux du mode test) :
#        STRIPE_PRIX_PREMIUM_MENSUEL = "<price_… réel>"   STRIPE_PRIX_PREMIUM_ANNUEL = "<price_… réel>"   STRIPE_PRIX_FAMILLE_ANNUEL = "<price_… réel>"
#   2. Secrets (tableau de bord, environnement « Production », type « Secret ») : STRIPE_CLE_SECRETE (sk_live_…), STRIPE_CLE_PUBLIABLE (pk_live_…),
#      STRIPE_SECRET_WEBHOOK (whsec_… du webhook https://leslanternesdenour.fr/api/stripe/webhook), puis STRIPE_MODE_REEL = autorise (interrupteur final).
#   3. Le contrôle outils/migration/basculer-cloudflare.mjs (« aucune variable STRIPE_* en production ») est fait pour la bascule initiale : il doit être adapté à ce moment-là.
# Stockage privé Premium : liaison R2 « R2_PREMIUM » (décision du créateur, 28/11/2026). Le seau « ldn-premium » est PRIVÉ (aucune URL publique) :
# son contenu n'est lisible que par /api/premium/*, qui applique les droits côté serveur (Gratuit/visiteur refusés, Premium/Famille/Créateur selon le catalogue).
# Les fichiers y sont déposés par le Créateur (page /admin/ → Pack Premium) ou par outils/sauvegarde ; il n'y a aucun contenu inventé : seau vide = zones fermées.
[[r2_buckets]]
binding = "R2_PREMIUM"
bucket_name = "ldn-premium"
