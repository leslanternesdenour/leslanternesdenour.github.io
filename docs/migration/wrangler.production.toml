# Configuration Cloudflare Pages de la PRODUCTION (branche « main »). Aucun secret ici.
# Ce fichier est la version « production » de wrangler.toml : il remplace wrangler.toml À LA MISE EN PRODUCTION (voir docs/MIGRATION-PRODUCTION.md).
# Le build refuse « main » tant que ENVIRONNEMENT n'y vaut pas "production" (outils/construire.mjs).
name = "lanternes-de-nour"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[vars]
ENVIRONNEMENT = "production"
# Identifiant PUBLIC du projet Firebase (pas un secret). Même projet que la préproduction : mêmes comptes, mêmes familles.
FIREBASE_PROJET = "lanternes-de-nour"

# Secrets (tableau de bord Cloudflare, environnement « Production », type « Secret ») : SESSION_SECRET, FIREBASE_COMPTE_SERVICE, CREATOR_UID.
# Paiement : NE PAS définir STRIPE_* en production tant que l'ouverture des paiements n'est pas décidée (le site affiche alors « Le paiement n'est pas encore ouvert »).
# Stockage privé Premium (R2_PREMIUM) : non activé.
